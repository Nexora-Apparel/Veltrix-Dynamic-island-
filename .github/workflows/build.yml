name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: island-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Check stable signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/veltrix-release.jks"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured. APK artifact built, but no update release was published."
          fi
      - name: Build release APK
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/veltrix-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" sign --ks "$KEYSTORE_PATH" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out app/build/outputs/apk/release/VeltrixIsland.apk app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Publish in-app update release
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.configured == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: main
          name: Veltrix Island ${{ github.run_number }}
          body: |
            In-app update for Veltrix Island.
            versionCode=${{ github.run_number }}
          files: app/build/outputs/apk/release/VeltrixIsland.apk
          overwrite_files: true
          make_latest: true
